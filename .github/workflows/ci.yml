name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 代码检查
        run: npm run lint
      - name: 类型检查
        run: npx tsc -b
      - name: 单元测试
        run: npm test
      - name: 构建
        run: npm run build
